name: build-qplug

# Builds the root .qplug distributables from Developer/plugins/<Name>/plugin.lua
# with QSC's PLUGCC.exe (a .NET assembly), on Windows (native) and on macOS
# (through mono), then checks the two outputs match (line endings aside). With
# `release` on, a GitHub release qplug-<run id> carries the files: the
# Windows-built set under its final names (LF), plus the raw Windows-* and
# macOS-* sets. Nothing is committed: the built files live only in releases.
# Manual dispatch only.

on:
  workflow_dispatch:
    inputs:
      plugin:
        description: Plugin folder under Developer/plugins, or all
        type: choice
        required: true
        default: Dolby CPSeries Control
        options:
          - all
          - Dolby CPSeries Control
          - CP Series Emulator
          - DolbyFader
          - Dolby Sweep
          - MultiFlip-Flop
          - SubharmonicSynth
          - StateTrigger
          - DolbyKnobTest
      release:
        description: Publish the built files as a GitHub release
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      plugins: ${{ steps.list.outputs.plugins }}
    steps:
      - id: list
        shell: bash
        run: |
          if [ "${{ inputs.plugin }}" = "all" ]; then
            echo 'plugins=["Dolby CPSeries Control","CP Series Emulator","DolbyFader","Dolby Sweep","MultiFlip-Flop","SubharmonicSynth","StateTrigger","DolbyKnobTest"]' >> "$GITHUB_OUTPUT"
          else
            echo 'plugins=["${{ inputs.plugin }}"]' >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        plugin: ${{ fromJson(needs.plan.outputs.plugins) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Fetch the compiler (BasePlugin and its nested PluginCompile)
        shell: bash
        run: |
          # BasePlugin's nested PluginCompile submodule is declared with an SSH URL,
          # and the runner has no key: read it over HTTPS instead.
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --recursive vendor/qsys-plugins/BasePlugin
      - name: Install mono (macOS)
        if: runner.os == 'macOS'
        run: brew install mono
      - name: Compile
        shell: bash
        run: |
          set -euo pipefail
          root="$PWD"
          compiler="$root/vendor/qsys-plugins/BasePlugin/PluginCompile/PLUGCC.exe"
          test -f "$compiler" || { echo "PLUGCC.exe not found at $compiler"; ls -R "$root/vendor/qsys-plugins/BasePlugin" | head -40; exit 1; }
          # PLUGCC resolves relative #include paths against its working directory.
          cd "Developer/plugins/${{ matrix.plugin }}"
          mark="$(mktemp)"
          if [ "$RUNNER_OS" = "macOS" ]; then
            mono "$compiler" "${{ matrix.plugin }}" plugin.lua
          else
            "$compiler" "${{ matrix.plugin }}" plugin.lua
          fi
          # Wherever it wrote the result, find it: any .qplug newer than the marker.
          mkdir -p "$root/out"
          found="$(find "$PWD" "$HOME/Documents" -name '*.qplug' -newer "$mark" -not -path '*/node_modules/*' 2>/dev/null | head -5)"
          echo "found: $found"
          test -n "$found" || { echo "no .qplug was produced"; exit 1; }
          first="$(echo "$found" | head -1)"
          cp "$first" "$root/out/${{ matrix.plugin }}.qplug"
          echo "built from: $first"
      - name: Show what was built
        shell: bash
        run: |
          f="out/${{ matrix.plugin }}.qplug"
          wc -c "$f"
          # An unexpanded directive is the comment  --[[ #include "x.lua" ]]  (a plain
          # mention of "#include" in prose is fine).
          if grep -nE '\-\-\[\[ *#include +"' "$f"; then echo "LEFTOVER #include directive in the output"; exit 1; fi
          grep -n 'BuildVersion' "$f" | head -2
          echo "===== BEGIN ${{ matrix.plugin }} ${{ runner.os }} ====="
          cat "$f"
          echo "===== END ${{ matrix.plugin }} ${{ runner.os }} ====="
      - uses: actions/upload-artifact@v4
        with:
          name: qplug-${{ runner.os }}-${{ matrix.plugin }}
          path: out/${{ matrix.plugin }}.qplug

  compare:
    needs: [plan, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Windows and macOS outputs must match (line endings aside)
        shell: bash
        run: |
          set -u
          fail=0
          while read -r name; do
            w="artifacts/qplug-Windows-$name/$name.qplug"
            m="artifacts/qplug-macOS-$name/$name.qplug"
            if cmp -s <(tr -d '\r' < "$w") <(tr -d '\r' < "$m"); then echo "identical (ignoring CRLF vs LF): $name"; else echo "DIFFERENT: $name"; fail=1; diff <(tr -d '\r' < "$w") <(tr -d '\r' < "$m") | head -5 || true; fi
          done < <(echo '${{ needs.plan.outputs.plugins }}' | python3 -c 'import json,sys; print("\n".join(json.load(sys.stdin)))')
          exit $fail

  publish:
    if: inputs.release
    needs: [plan, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          declare -A FINAL=(
            ["Dolby CPSeries Control"]="Dolby CPSeries Control V4.0.qplug"
            ["CP Series Emulator"]="CP Series Emulator.qplug"
            ["DolbyFader"]="DolbyFader.qplug"
            ["Dolby Sweep"]="Dolby Sweep V2.0.qplug"
            ["MultiFlip-Flop"]="MultiFlip-Flop.qplug"
            ["SubharmonicSynth"]="SubharmonicSynth.qplug"
            ["StateTrigger"]="StateTrigger.qplug"
            ["DolbyKnobTest"]="DolbyKnobTest.qplug"
          )
          mkdir -p release
          while read -r name; do
            tr -d '\r' < "artifacts/qplug-Windows-$name/$name.qplug" > "release/${FINAL[$name]}"
            cp "artifacts/qplug-Windows-$name/$name.qplug" "release/Windows-$name.qplug"
            cp "artifacts/qplug-macOS-$name/$name.qplug" "release/macOS-$name.qplug"
          done < <(echo '${{ needs.plan.outputs.plugins }}' | python3 -c 'import json,sys; print("\n".join(json.load(sys.stdin)))')
          gh release create "qplug-${{ github.run_id }}" release/* \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "qplug build ${{ github.run_id }}" \
            --notes "PLUGCC output built from ${{ github.sha }}. Files without a prefix are the Windows build with LF line endings; Windows-* and macOS-* are the raw outputs of each build."
