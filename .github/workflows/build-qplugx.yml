name: Build .qplugx

# Manual only: encrypting a plugin is a deliberate release step, not
# something to run on every push. Uses QSC's own vendored
# plugin_tool_release.exe (vendor/qsys-plugins/PluginEncryptionTool/release/),
# a Windows binary, hence windows-latest. Output is uploaded as a workflow
# artifact only -- this never commits the .qplugx back to the repo.
#
# submodules: false + a manual, scoped submodule init (PluginEncryptionTool
# only) deliberately avoids `submodules: recursive`, which would also try
# to clone vendor/qsc-q-sys and fail on this runner's default token (same
# fix already applied to build-qplug.yml -- see CLAUDE.md continuity notes).
on:
  workflow_dispatch:
    inputs:
      qplug:
        description: "Which root .qplug to encrypt"
        required: true
        default: all
        type: choice
        options:
          - all
          - DolbyFader.qplug
          - Dolby Sweep V2.0.qplug
          - MultiFlip-Flop.qplug
          - Dolby CPSeries Control V4.0.qplug

jobs:
  encrypt:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Init only the PluginEncryptionTool submodule (plugin_tool_release.exe lives there)
        shell: pwsh
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init vendor/qsys-plugins/PluginEncryptionTool

      - name: Encrypt selected plugin(s)
        shell: pwsh
        run: |
          $tool = Join-Path $env:GITHUB_WORKSPACE "vendor\qsys-plugins\PluginEncryptionTool\release\plugin_tool_release.exe"
          if (-not (Test-Path $tool)) {
            throw "plugin_tool_release.exe not found at $tool -- submodule not initialized?"
          }

          $all = @(
            "DolbyFader.qplug",
            "Dolby Sweep V2.0.qplug",
            "MultiFlip-Flop.qplug",
            "Dolby CPSeries Control V4.0.qplug"
          )
          $selected = if ("${{ inputs.qplug }}" -eq "all") { $all } else { @("${{ inputs.qplug }}") }

          New-Item -ItemType Directory -Force -Path out | Out-Null
          foreach ($name in $selected) {
            $inPath = Join-Path $env:GITHUB_WORKSPACE $name
            if (-not (Test-Path $inPath)) {
              throw "input file not found: $inPath"
            }
            $outName = [System.IO.Path]::ChangeExtension($name, "qplugx")
            $outPath = Join-Path "out" $outName
            & $tool encrypt $inPath $outPath
            if ($LASTEXITCODE -ne 0) {
              throw "plugin_tool_release.exe failed on $name (exit $LASTEXITCODE)"
            }
            # Also echoed to the job log (not just uploaded as an artifact):
            # the artifact's blob-storage download URL isn't reachable
            # through this session's egress proxy, but job logs are (GitHub
            # API) -- same workaround as build-qplug.yml. .qplugx is a JSON
            # envelope (text), safe to print.
            Write-Host "----- BEGIN $outName -----"
            Get-Content $outPath | Write-Host
            Write-Host "----- END $outName -----"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: qplugx-build
          path: out/*.qplugx
          if-no-files-found: error
